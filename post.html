body{

/* HEADER */

header{
background:#82b2ed;

padding:10px 18px;
background:#2bb3c0;
color:white;

<body>

<header>Post Lost / Found Item</header>
<br>

<div class="post-box">

<input type="text" id="username" placeholder="Username">

<input type="text" id="item" placeholder="Item Name">

<select id="type">
<option>Lost</option>
<option>Found</option>
</select>

<input type="date" id="date">

<input type="time" id="time">

<input type="text" id="location" placeholder="Location">

<input type="file" id="image">

<br><br>

<button onclick="createPost()">Post</button>

</div>


<h2>User Posts</h2>

<div id="feed"></div>


<script>

/* LOAD SAVED POSTS */

window.onload=function(){

let savedPosts=JSON.parse(localStorage.getItem("posts")) || [];

savedPosts.forEach(p=>{
displayPost(p);
});

};


/* CREATE POST */

function createPost(){

let username=document.getElementById("username").value;
let item=document.getElementById("item").value;
let type=document.getElementById("type").value;
let date=document.getElementById("date").value;
let time=document.getElementById("time").value;
let location=document.getElementById("location").value;

let imageInput=document.getElementById("image");

let reader=new FileReader();

reader.onload=function(){

let postData={
username,
item,
type,
date,
time,
location,
image:reader.result,
likes:0,
comments:[]
};

let posts=JSON.parse(localStorage.getItem("posts")) || [];
posts.unshift(postData);

localStorage.setItem("posts",JSON.stringify(posts));

displayPost(postData);

};

if(imageInput.files[0]){
reader.readAsDataURL(imageInput.files[0]);
}else{
reader.onload();
}

}


/* DISPLAY POST */

function displayPost(p){

let post=document.createElement("div");
post.className="post";

post.innerHTML=`

<b>${p.type} Item</b><br>
<b>Item:</b> ${p.item}<br>
<b>User:</b> ${p.username}<br>
<b>Location:</b> ${p.location}<br>
<b>Date:</b> ${p.date} ${p.time}

${p.image ? `<img src="${p.image}">` : ""}

<div class="actions">

<button onclick="likePost(this)">❤️ Like</button>

</div>

<div class="comments"></div>

<input class="comment-box" placeholder="Write comment">

<button onclick="addComment(this)">Comment</button>

`;

document.getElementById("feed").prepend(post);

}


/* LIKE */

function likePost(btn){

btn.innerText="❤️ Liked";

}


/* COMMENT */

function addComment(btn){

let post=btn.parentElement.parentElement;

let input=post.querySelector(".comment-box");

let text=input.value;

if(text==="") return;

let comment=document.createElement("div");
comment.className="comment";
comment.innerText=text;

post.querySelector(".comments").appendChild(comment);

input.value="";

}

</script>

</body>
</html>
